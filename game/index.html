<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Turkey Breakout — a 3D Thanksgiving escape</title>
<!-- Three.js is vendored under game/vendor/ — no libraries, no network requests:
     the whole game is the files under game/. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3a2b63; }
  #stage { position: fixed; inset: 0; margin: auto; }
  #game, #hud { position: absolute; inset: 0; margin: auto; display: block; touch-action: none; }
  #hud { pointer-events: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" aria-label="The Great Turkey Breakout: a turkey flees the farmhouse at sunset, dodging the oven and the carving knife, chased by the farmer, toward the forest"></canvas>
  <canvas id="hud" aria-hidden="true"></canvas>
</div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
